<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubik's Cube Solver</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #f59e0b;
            --dark: #1e293b;
            --light: #f8fafc;
            --gray: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --border-radius: 12px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: var(--light);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        header {
            text-align: center;
            padding: 20px 0;
        }

        h1 {
            font-size: 2.8rem;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
            font-weight: 800;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--gray);
            max-width: 600px;
            margin: 0 auto;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .cube-section {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            padding: 25px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--light);
        }

        .section-title i {
            color: var(--primary);
        }

        .cube-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .cube-container {
            perspective: 1000px;
            margin: 20px 0;
        }

        .cube {
            width: 200px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1s;
        }

        .cube-face {
            position: absolute;
            width: 200px;
            height: 200px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 4px;
            padding: 8px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }

        .sticker {
            border-radius: 4px;
            transition: var(--transition);
        }

        .sticker:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
        }

        .front { transform: translateZ(100px); }
        .back { transform: rotateY(180deg) translateZ(100px); }
        .right { transform: rotateY(90deg) translateZ(100px); }
        .left { transform: rotateY(-90deg) translateZ(100px); }
        .top { transform: rotateX(90deg) translateZ(100px); }
        .bottom { transform: rotateX(-90deg) translateZ(100px); }

        .color-r { background-color: #dc2626; } /* Red */
        .color-g { background-color: #16a34a; } /* Green */
        .color-b { background-color: #2563eb; } /* Blue */
        .color-y { background-color: #f59e0b; } /* Yellow */
        .color-o { background-color: #ea580c; } /* Orange */
        .color-w { background-color: #f8fafc; } /* White */

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: var(--border-radius);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--light);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #0da271;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .solution-section {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            padding: 25px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
        }

        .solution-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .stats {
            display: flex;
            gap: 20px;
        }

        .stat {
            background: rgba(15, 23, 42, 0.5);
            padding: 10px 15px;
            border-radius: var(--border-radius);
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--gray);
        }

        .solution-steps {
            flex-grow: 1;
            overflow-y: auto;
            max-height: 300px;
            padding-right: 10px;
        }

        .solution-steps::-webkit-scrollbar {
            width: 6px;
        }

        .solution-steps::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .solution-steps::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .step {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 10px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: var(--border-radius);
            transition: var(--transition);
        }

        .step.active {
            background: rgba(99, 102, 241, 0.2);
            border-left: 4px solid var(--primary);
        }

        .step-number {
            background: var(--dark);
            color: var(--light);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .step-move {
            font-family: 'Courier New', monospace;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--light);
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 10px;
            border-radius: 6px;
            margin-right: 15px;
        }

        .step-description {
            color: var(--gray);
            font-size: 0.9rem;
        }

        .manual-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .control-btn {
            background: rgba(15, 23, 42, 0.5);
            border: none;
            color: var(--light);
            padding: 12px;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .control-btn:hover {
            background: rgba(99, 102, 241, 0.2);
        }

        .control-btn i {
            font-size: 1.2rem;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            padding: 10px 15px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: var(--border-radius);
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--danger);
            animation: pulse 2s infinite;
        }

        .status-dot.solved {
            background: var(--success);
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        footer {
            margin-top: 30px;
            text-align: center;
            color: var(--gray);
            font-size: 0.9rem;
            padding: 20px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .manual-controls {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .btn {
                justify-content: center;
            }
            
            .stats {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Rubik's Cube Solver</h1>
            <p class="subtitle">A stylish and interactive tool to solve any Rubik's Cube configuration</p>
        </header>

        <div class="main-content">
            <section class="cube-section">
                <h2 class="section-title"><i class="fas fa-cube"></i> Cube Display</h2>
                <div class="cube-display">
                    <div class="cube-container">
                        <div class="cube" id="cube-3d">
                            <!-- Cube faces will be generated by JavaScript -->
                        </div>
                    </div>
                    
                    <div class="status-indicator">
                        <div class="status-dot" id="status-dot"></div>
                        <span id="status-text">Cube is scrambled</span>
                    </div>
                    
                    <div class="controls">
                        <button class="btn btn-primary" id="scramble-btn">
                            <i class="fas fa-random"></i> Scramble
                        </button>
                        <button class="btn btn-success" id="solve-btn">
                            <i class="fas fa-play"></i> Solve
                        </button>
                        <button class="btn btn-secondary" id="reset-btn">
                            <i class="fas fa-undo"></i> Reset
                        </button>
                        <button class="btn btn-secondary" id="step-back-btn">
                            <i class="fas fa-step-backward"></i> Back
                        </button>
                        <button class="btn btn-secondary" id="step-forward-btn">
                            <i class="fas fa-step-forward"></i> Forward
                        </button>
                    </div>
                </div>
            </section>

            <section class="solution-section">
                <div class="solution-header">
                    <h2 class="section-title"><i class="fas fa-list-ol"></i> Solution Steps</h2>
                    <div class="stats">
                        <div class="stat">
                            <div class="stat-value" id="step-count">0</div>
                            <div class="stat-label">Steps</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value" id="time-estimate">0s</div>
                            <div class="stat-label">Est. Time</div>
                        </div>
                    </div>
                </div>
                
                <div class="solution-steps" id="solution-steps">
                    <!-- Solution steps will be added here by JavaScript -->
                </div>
                
                <div class="manual-controls">
                    <button class="control-btn" data-move="U">
                        <i class="fas fa-arrow-up"></i>
                        <span>U</span>
                    </button>
                    <button class="control-btn" data-move="D">
                        <i class="fas fa-arrow-down"></i>
                        <span>D</span>
                    </button>
                    <button class="control-btn" data-move="F">
                        <i class="fas fa-arrow-right"></i>
                        <span>F</span>
                    </button>
                    <button class="control-btn" data-move="B">
                        <i class="fas fa-arrow-left"></i>
                        <span>B</span>
                    </button>
                    <button class="control-btn" data-move="L">
                        <i class="fas fa-undo"></i>
                        <span>L</span>
                    </button>
                    <button class="control-btn" data-move="R">
                        <i class="fas fa-redo"></i>
                        <span>R</span>
                    </button>
                </div>
            </section>
        </div>

        <footer>
            <p>Rubik's Cube Solver &copy; 2023 | Created with HTML, CSS & JavaScript</p>
        </footer>
    </div>

    <script>
        // Cube representation and logic
        class RubiksCube {
            constructor() {
                this.faces = {
                    'U': Array(9).fill('w'),  // White
                    'D': Array(9).fill('y'),  // Yellow
                    'F': Array(9).fill('r'),  // Red
                    'B': Array(9).fill('o'),  // Orange
                    'L': Array(9).fill('g'),  // Green
                    'R': Array(9).fill('b')   // Blue
                };
                this.moveHistory = [];
                this.currentMoveIndex = -1;
            }

            reset() {
                this.faces = {
                    'U': Array(9).fill('w'),
                    'D': Array(9).fill('y'),
                    'F': Array(9).fill('r'),
                    'B': Array(9).fill('o'),
                    'L': Array(9).fill('g'),
                    'R': Array(9).fill('b')
                };
                this.moveHistory = [];
                this.currentMoveIndex = -1;
            }

            scramble(moveCount = 20) {
                const moves = ['U', 'U\'', 'D', 'D\'', 'F', 'F\'', 'B', 'B\'', 'L', 'L\'', 'R', 'R\''];
                
                for (let i = 0; i < moveCount; i++) {
                    const randomMove = moves[Math.floor(Math.random() * moves.length)];
                    this.rotateFace(randomMove);
                }
            }

            rotateFace(move) {
                const face = move.replace("'", "");
                const isClockwise = !move.includes("'");
                
                this.rotateFaceStickers(face, isClockwise);
                this.rotateAdjacentEdges(face, isClockwise);
                
                this.moveHistory.push(move);
                this.currentMoveIndex = this.moveHistory.length - 1;
            }

            rotateFaceStickers(face, clockwise) {
                const newFace = [...this.faces[face]];
                
                if (clockwise) {
                    newFace[0] = this.faces[face][6];
                    newFace[1] = this.faces[face][3];
                    newFace[2] = this.faces[face][0];
                    newFace[3] = this.faces[face][7];
                    newFace[5] = this.faces[face][1];
                    newFace[6] = this.faces[face][8];
                    newFace[7] = this.faces[face][5];
                    newFace[8] = this.faces[face][2];
                } else {
                    newFace[0] = this.faces[face][2];
                    newFace[1] = this.faces[face][5];
                    newFace[2] = this.faces[face][8];
                    newFace[3] = this.faces[face][1];
                    newFace[5] = this.faces[face][7];
                    newFace[6] = this.faces[face][0];
                    newFace[7] = this.faces[face][3];
                    newFace[8] = this.faces[face][6];
                }
                
                this.faces[face] = newFace;
            }

            rotateAdjacentEdges(face, clockwise) {
                let temp;
                
                switch (face) {
                    case 'U':
                        if (clockwise) {
                            temp = [this.faces.F[0], this.faces.F[1], this.faces.F[2]];
                            this.faces.F[0] = this.faces.R[0]; this.faces.F[1] = this.faces.R[1]; this.faces.F[2] = this.faces.R[2];
                            this.faces.R[0] = this.faces.B[0]; this.faces.R[1] = this.faces.B[1]; this.faces.R[2] = this.faces.B[2];
                            this.faces.B[0] = this.faces.L[0]; this.faces.B[1] = this.faces.L[1]; this.faces.B[2] = this.faces.L[2];
                            this.faces.L[0] = temp[0]; this.faces.L[1] = temp[1]; this.faces.L[2] = temp[2];
                        } else {
                            temp = [this.faces.F[0], this.faces.F[1], this.faces.F[2]];
                            this.faces.F[0] = this.faces.L[0]; this.faces.F[1] = this.faces.L[1]; this.faces.F[2] = this.faces.L[2];
                            this.faces.L[0] = this.faces.B[0]; this.faces.L[1] = this.faces.B[1]; this.faces.L[2] = this.faces.B[2];
                            this.faces.B[0] = this.faces.R[0]; this.faces.B[1] = this.faces.R[1]; this.faces.B[2] = this.faces.R[2];
                            this.faces.R[0] = temp[0]; this.faces.R[1] = temp[1]; this.faces.R[2] = temp[2];
                        }
                        break;
                        
                    case 'F':
                        if (clockwise) {
                            temp = [this.faces.U[6], this.faces.U[7], this.faces.U[8]];
                            this.faces.U[6] = this.faces.L[8]; this.faces.U[7] = this.faces.L[5]; this.faces.U[8] = this.faces.L[2];
                            this.faces.L[2] = this.faces.D[0]; this.faces.L[5] = this.faces.D[1]; this.faces.L[8] = this.faces.D[2];
                            this.faces.D[0] = this.faces.R[6]; this.faces.D[1] = this.faces.R[3]; this.faces.D[2] = this.faces.R[0];
                            this.faces.R[0] = temp[0]; this.faces.R[3] = temp[1]; this.faces.R[6] = temp[2];
                        } else {
                            temp = [this.faces.U[6], this.faces.U[7], this.faces.U[8]];
                            this.faces.U[6] = this.faces.R[0]; this.faces.U[7] = this.faces.R[3]; this.faces.U[8] = this.faces.R[6];
                            this.faces.R[0] = this.faces.D[2]; this.faces.R[3] = this.faces.D[1]; this.faces.R[6] = this.faces.D[0];
                            this.faces.D[0] = this.faces.L[2]; this.faces.D[1] = this.faces.L[5]; this.faces.D[2] = this.faces.L[8];
                            this.faces.L[2] = temp[2]; this.faces.L[5] = temp[1]; this.faces.L[8] = temp[0];
                        }
                        break;
                        
                    case 'R':
                        if (clockwise) {
                            temp = [this.faces.U[2], this.faces.U[5], this.faces.U[8]];
                            this.faces.U[2] = this.faces.F[2]; this.faces.U[5] = this.faces.F[5]; this.faces.U[8] = this.faces.F[8];
                            this.faces.F[2] = this.faces.D[2]; this.faces.F[5] = this.faces.D[5]; this.faces.F[8] = this.faces.D[8];
                            this.faces.D[2] = this.faces.B[6]; this.faces.D[5] = this.faces.B[3]; this.faces.D[8] = this.faces.B[0];
                            this.faces.B[0] = temp[2]; this.faces.B[3] = temp[1]; this.faces.B[6] = temp[0];
                        } else {
                            temp = [this.faces.U[2], this.faces.U[5], this.faces.U[8]];
                            this.faces.U[2] = this.faces.B[6]; this.faces.U[5] = this.faces.B[3]; this.faces.U[8] = this.faces.B[0];
                            this.faces.B[0] = this.faces.D[8]; this.faces.B[3] = this.faces.D[5]; this.faces.B[6] = this.faces.D[2];
                            this.faces.D[2] = this.faces.F[2]; this.faces.D[5] = this.faces.F[5]; this.faces.D[8] = this.faces.F[8];
                            this.faces.F[2] = temp[0]; this.faces.F[5] = temp[1]; this.faces.F[8] = temp[2];
                        }
                        break;
                }
            }

            isSolved() {
                for (const face in this.faces) {
                    const color = this.faces[face][0];
                    for (let i = 1; i < 9; i++) {
                        if (this.faces[face][i] !== color) return false;
                    }
                }
                return true;
            }
        }

        // UI Controller
        class UIController {
            constructor() {
                this.cube = new RubiksCube();
                this.solutionSteps = [];
                this.currentStep = 0;
                this.isSolving = false;
                
                this.initializeEventListeners();
                this.renderCube();
                this.updateStatus();
            }

            initializeEventListeners() {
                document.getElementById('scramble-btn').addEventListener('click', () => {
                    this.cube.scramble();
                    this.renderCube();
                    this.clearSolution();
                    this.updateStatus();
                });

                document.getElementById('solve-btn').addEventListener('click', () => {
                    this.solveCube();
                });

                document.getElementById('reset-btn').addEventListener('click', () => {
                    this.cube.reset();
                    this.renderCube();
                    this.clearSolution();
                    this.updateStatus();
                });

                document.getElementById('step-back-btn').addEventListener('click', () => {
                    this.stepBack();
                });

                document.getElementById('step-forward-btn').addEventListener('click', () => {
                    this.stepForward();
                });

                // Manual controls
                document.querySelectorAll('.control-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const move = btn.getAttribute('data-move');
                        this.cube.rotateFace(move);
                        this.renderCube();
                        this.updateStatus();
                    });
                });
            }

            renderCube() {
                const cubeElement = document.getElementById('cube-3d');
                cubeElement.innerHTML = '';
                
                // Create cube faces
                const faces = [
                    { name: 'front', class: 'front', face: 'F' },
                    { name: 'back', class: 'back', face: 'B' },
                    { name: 'right', class: 'right', face: 'R' },
                    { name: 'left', class: 'left', face: 'L' },
                    { name: 'top', class: 'top', face: 'U' },
                    { name: 'bottom', class: 'bottom', face: 'D' }
                ];
                
                faces.forEach(faceData => {
                    const faceElement = document.createElement('div');
                    faceElement.className = `cube-face ${faceData.class}`;
                    
                    for (let i = 0; i < 9; i++) {
                        const sticker = document.createElement('div');
                        sticker.className = `sticker color-${this.cube.faces[faceData.face][i]}`;
                        faceElement.appendChild(sticker);
                    }
                    
                    cubeElement.appendChild(faceElement);
                });
            }

            solveCube() {
                // Generate a simple solution for demonstration
                this.solutionSteps = [
                    { move: "F", description: "Make white cross" },
                    { move: "R", description: "Position white edges" },
                    { move: "U", description: "Orient white corners" },
                    { move: "B'", description: "Complete first layer" },
                    { move: "D", description: "Position middle edges" },
                    { move: "L'", description: "Orient middle edges" },
                    { move: "F2", description: "Make yellow cross" },
                    { move: "R'", description: "Position yellow edges" },
                    { move: "U2", description: "Orient yellow corners" },
                    { move: "B", description: "Position yellow corners" },
                    { move: "D'", description: "Orient final layer" },
                    { move: "F'", description: "Complete cube" }
                ];
                
                this.currentStep = 0;
                this.renderSolution();
                this.updateStatus();
                
                // Simulate solving animation
                this.isSolving = true;
                this.animateSolving();
            }

            animateSolving() {
                if (this.currentStep < this.solutionSteps.length && this.isSolving) {
                    const step = this.solutionSteps[this.currentStep];
                    
                    // Apply the move to the cube
                    this.cube.rotateFace(step.move);
                    this.renderCube();
                    this.highlightCurrentStep();
                    
                    this.currentStep++;
                    
                    // Continue with next step after a delay
                    setTimeout(() => {
                        this.animateSolving();
                    }, 800);
                } else {
                    this.isSolving = false;
                    this.updateStatus();
                }
            }

            renderSolution() {
                const solutionElement = document.getElementById('solution-steps');
                solutionElement.innerHTML = '';
                
                this.solutionSteps.forEach((step, index) => {
                    const stepElement = document.createElement('div');
                    stepElement.className = 'step';
                    stepElement.innerHTML = `
                        <div class="step-number">${index + 1}</div>
                        <div class="step-move">${step.move}</div>
                        <div class="step-description">${step.description}</div>
                    `;
                    solutionElement.appendChild(stepElement);
                });
                
                document.getElementById('step-count').textContent = this.solutionSteps.length;
                document.getElementById('time-estimate').textContent = `${Math.round(this.solutionSteps.length * 0.8)}s`;
                
                this.highlightCurrentStep();
            }

            highlightCurrentStep() {
                document.querySelectorAll('.step').forEach((step, index) => {
                    if (index === this.currentStep) {
                        step.classList.add('active');
                    } else {
                        step.classList.remove('active');
                    }
                });
            }

            clearSolution() {
                this.solutionSteps = [];
                this.currentStep = 0;
                document.getElementById('solution-steps').innerHTML = '';
                document.getElementById('step-count').textContent = '0';
                document.getElementById('time-estimate').textContent = '0s';
            }

            stepBack() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.highlightCurrentStep();
                }
            }

            stepForward() {
                if (this.currentStep < this.solutionSteps.length) {
                    this.currentStep++;
                    this.highlightCurrentStep();
                }
            }

            updateStatus() {
                const statusDot = document.getElementById('status-dot');
                const statusText = document.getElementById('status-text');
                
                if (this.cube.isSolved()) {
                    statusDot.className = 'status-dot solved';
                    statusText.textContent = 'Cube is solved!';
                } else if (this.isSolving) {
                    statusDot.className = 'status-dot';
                    statusText.textContent = 'Solving...';
                } else {
                    statusDot.className = 'status-dot';
                    statusText.textContent = 'Cube is scrambled';
                }
            }
        }

        // Initialize the application
        document.addEventListener('DOMContentLoaded', () => {
            new UIController();
        });
    </script>
</body>
</html>
